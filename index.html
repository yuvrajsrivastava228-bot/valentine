<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>For My Sweetheart ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
    <title>Document</title>
  </head>
  <body>
    <!-- Envelope Screen -->
    <div id="envelope-container">
      <img src="envelope1.png" alt="Envelope" id="envelope" />
      <p>For You, My Love ❤️</p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">Will you be my Valentine?</h1>

        <img src="dagonyang.png" class="dagonyang" id="letter-dagonyang" />

        <div class="buttons" id="letter-buttons">
          <img src="Yes.png" class="btn yes-btn" alt="Yes" />

          <div class="no-wrapper">
            <img src="No.png" class="btn no-btn" alt="No" />
          </div>
        </div>

        <p id="final-text" class="final-text" style="display: none">
          <strong>YAIEIEIEIEIEEE!!!</strong> HAPPY VALENTINE'S MY BABY ❤️❤️❤️
        </p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
